# Configuración para publicar en Netlify (fase definitiva).
# En Netlify, define estas variables en Site configuration → Environment variables:
#   PUBLIC_SITE_URL=https://mitruconstructor.com
#   PUBLIC_FORM_PROVIDER=netlify
#   PUBLIC_INDEXABLE=true            (solo cuando los datos sean definitivos)
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
